<svg width="438" height="438" viewBox="0 0 438 438" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="parchTeeth1" x1="219" y1="60" x2="219" y2="378" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FF95"/>
      <stop offset="1" stop-color="#00FF80"/>
    </linearGradient>
    <linearGradient id="parchRing" x1="219" y1="79" x2="219" y2="359" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FF95"/>
      <stop offset="0.35" stop-color="#00A9FF"/>
      <stop offset="0.65" stop-color="#00EAFF"/>
      <stop offset="1" stop-color="#0080FF"/>
    </linearGradient>
    <linearGradient id="parchChip" x1="169" y1="169" x2="269" y2="269" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00EAFF"/>
      <stop offset="1" stop-color="#00A9FF"/>
    </linearGradient>
    <mask id="ringMask">
      <rect width="438" height="438" fill="white"/>
      <circle cx="219" cy="219" r="86" fill="black"/>
    </mask>
  </defs>

  <!-- gear teeth: 12 facets cycling through the Parch palette -->
  <g>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00FF95" transform="rotate(0 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00A9FF" transform="rotate(30 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00EAFF" transform="rotate(60 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#0080FF" transform="rotate(90 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00FF80" transform="rotate(120 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00FF95" transform="rotate(150 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00A9FF" transform="rotate(180 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00EAFF" transform="rotate(210 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#0080FF" transform="rotate(240 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00FF80" transform="rotate(270 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00FF95" transform="rotate(300 219 219)"/>
    <rect x="207" y="52" width="24" height="46" rx="4" fill="#00A9FF" transform="rotate(330 219 219)"/>
  </g>

  <!-- gear ring body -->
  <circle cx="219" cy="219" r="140" fill="url(#parchRing)" mask="url(#ringMask)"/>

  <!-- CPU / kernel chip at the core -->
  <g>
    <!-- pins -->
    <rect x="185" y="150" width="8" height="16" fill="#00A9FF"/>
    <rect x="209" y="150" width="8" height="16" fill="#00A9FF"/>
    <rect x="233" y="150" width="8" height="16" fill="#00A9FF"/>

    <rect x="185" y="272" width="8" height="16" fill="#0080FF"/>
    <rect x="209" y="272" width="8" height="16" fill="#0080FF"/>
    <rect x="233" y="272" width="8" height="16" fill="#0080FF"/>

    <rect x="150" y="185" width="16" height="8" fill="#00A9FF"/>
    <rect x="150" y="209" width="16" height="8" fill="#00A9FF"/>
    <rect x="150" y="233" width="16" height="8" fill="#00A9FF"/>

    <rect x="272" y="185" width="16" height="8" fill="#0080FF"/>
    <rect x="272" y="209" width="16" height="8" fill="#0080FF"/>
    <rect x="272" y="233" width="16" height="8" fill="#0080FF"/>

    <!-- chip body -->
    <rect x="169" y="169" width="100" height="100" rx="10" fill="url(#parchChip)"/>

    <!-- inner kernel core mark -->
    <rect x="197" y="197" width="44" height="44" rx="6" fill="#0B1220"/>
    <path d="M209 219 L219 209 L229 219 L219 229 Z" fill="#00FF95"/>
  </g>
</svg>
